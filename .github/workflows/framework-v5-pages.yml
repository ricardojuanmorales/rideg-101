# Optional build-only preview for RIDEG 101.
# GitHub Pages deployment remains disabled until explicitly requested.
name: Framework V5 Optional Site Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/framework-v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: FRAMEWORK_V5_BASE_PATH=/rideg-101/v5/ npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rideg101-optional-site-preview
          path: apps/framework-v5/dist
